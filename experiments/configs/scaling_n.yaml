# Experiment C1: how does N_all(eps) scale with the number of agents n?
# Draft; values still to be agreed on in the group.

name: scaling_n
family: F1            # F1 = random_game, F2 = aggregative_game
n: [2, 3, 4, 5, 6, 7, 8]
A: 2                  # actions per agent
S: 3
H: 3
sigma: 0.3
epsilon: 0.1

n_instances: 10       # random games per n (seeds 0..9)
n_sampling_seeds: 10  # repetitions per game and budget
success_rate: 0.9     # N_all(eps) = smallest budget with gap <= eps in >= 90 % of seeds

methods:
  plugin:
    m: [1, 2, 4, 8, 16, 32, 64, 128]   # samples per (h, s, joint action), doubling
    K_solver: 2000
  robust_q_ftrl:
    N: [1, 2, 4, 8, 16, 32]
    K: [64, 128, 256, 512, 1024, 2048]
