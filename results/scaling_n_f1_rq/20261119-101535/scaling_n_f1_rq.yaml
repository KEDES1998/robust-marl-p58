# Robust-Q-FTRL on game family F1 with the settings of scaling_n.yaml, so that its N_all can be
# set next to the plug-in sweep results/scaling_n/20261108-133521 (Protocol.md, Section 1.9).
# Smaller grid than scaling_n.yaml: N = 1 already suffices in practice (Protocol.md, Section 3).

name: scaling_n_f1_rq
family: F1
n: [2, 3, 4, 5, 6, 7, 8]
A: 2
S: 3
H: 3
sigma: 0.3
epsilon: 0.1

n_instances: 10
n_sampling_seeds: 10
success_rate: 0.9

c_alpha: 1.0

methods:
  exact:
    K: 2000
  plugin:
    m: [1, 2, 4, 8, 16, 32, 64, 128]
    K_solver: 2000
  robust_q_ftrl:
    N: [1, 4]
    # K = 1 learns nothing (eta = 0): the output is the uniform policy. It is in the grid to show
    # where F1 is already solved without learning (Protocol.md, Section 3).
    K: [1, 32, 64, 128, 256, 512, 1024, 2048]
    c_b: 0.0
